# ============================================================
#  BDEIMT - configuration
#  Apres une modification : /imt reload (ou /stop pour redemarrer)
# ============================================================

# Le seul admin du serveur (prefixe [Mobutu])
admin: curlybrownhair

# Message envoye a chaque connexion
whatsapp:
  numero: "+33 6 75 15 77 40"
  lien: "https://wa.me/33675157740"

# Astuces de Poulpy dans le chat (en minutes)
astuces-toutes-les-minutes: 20

# Rappel "/guide" de Poulpy (en minutes)
rappel-guide-toutes-les-minutes: 120

# Reapparition de l'Ender Dragon (en heures)
dragon-toutes-les-heures: 48

# ============================================================
#  Les univers
# ============================================================
# Ouvrir ou fermer un mode de jeu. Un mode ferme s'affiche
# « bientot disponible » dans la boussole, ses commandes ne repondent
# plus, et son monde n'est meme pas charge. Rien n'est efface : remettre
# true et redemarrer suffit a le rouvrir tel quel.
modes:
  survie: true
  parkour: true
  skyblock: false
  parcelles: true

# On attend le /login dans le hub plutot que sur l'ile flottante.
# Mettre false pour revenir a l'ancienne ile du vide.
connexion-dans-le-hub: true
# ============================================================
#  Points d'arrivee
# ============================================================
# Point d'arrivee de chaque monde. Le plus simple est de se placer
# au bon endroit en jeu et de taper :  /imt monde spawn hub
# (zones : hub, parkour, skyhub, skyblock, parcelles)
mondes:
  hub:
    # Releve dans la carte livree : l'endroit ou se tenait son auteur.
    # Si ce n'est pas le bon, place-toi au bon endroit et tape /imt monde spawn hub
    spawn: "bdeimt_hub;191.5;-44.0;142.5;0.0;0.0"
  parkour:
    # Le depart du Warden Parkour, releve dans la carte livree.
    spawn: "bdeimt_parkour;0.5;43.0;-0.5;1.5;0.3"
  parcelles:
    spawn: ""
  skyhub:
    spawn: ""

# Portails physiques : on marche dedans, on change de monde.
# A poser en jeu avec :  /imt portail parkour 2
portails: []

# ============================================================
#  Les PNJ du hub
# ============================================================
# Zaza se frappe et revient. Le Mobutu a la vie d'un Warden et rend
# cinq fois les degats recus.
# Trois facons de leur donner un skin :
#
#  1. Depuis un fichier PNG (le plus simple) : depose ton image dans
#     plugins/BDEIMT/skins/ en l'appelant zaza.png ou mobutu.png, puis
#     redemarre, ou tape en jeu :  /imt pnj skin zaza fichier
#     Le skin doit faire 64 x 64 pixels.
#
#  2. En copiant le skin d'un compte Minecraft existant :
#     /imt pnj skin zaza <pseudo>
#
#  3. A la main : va sur mineskin.org, envoie ton PNG, et colle les deux
#     chaines "value" et "signature" ci-dessous dans texture et signature.
#
# Pour les placer : se mettre au bon endroit puis  /imt pnj zaza
pnj:
  zaza:
    pseudo: ""
    texture: ""
    signature: ""
    position: ""
    # classic = bras larges (Steve), slim = bras fins (Alex)
    modele: "classic"
  mobutu:
    pseudo: ""
    texture: ""
    signature: ""
    position: ""
    modele: "classic"
    # Le compte admin porte le skin du Mobutu, quel que soit le sien.
    aussi-pour-l-admin: true

# Facultatif : une cle d'API MineSkin (mineskin.org) si l'envoi automatique
# des PNG est refuse pour cause de trop grand nombre de demandes.
mineskin-cle: ""

# ============================================================
#  Les sons du BDE
# ============================================================
# Un extrait joue quand on prend le kit d'une liste (/vote <liste>),
# en survie seulement. Les sons voyagent dans un « pack de ressources »
# que le jeu de chaque joueur telecharge une fois.
#  pack-url  : l'adresse ou le pack .zip est depose (mc-packs.net par ex.)
#  pack-sha1 : son empreinte, donnee en meme temps que le pack
# Vide = pas de pack, pas de son.
sons:
  pack-url: ""
  pack-sha1: ""
