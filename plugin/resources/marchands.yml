# ============================================================
#  Les marchands du lobby skyblock
# ============================================================
# Chaque offre tient sur une ligne :
#
#     MATERIAU  LOT  achat=PRIX  vente=PRIX  [livre=enchantement:niveau]
#
#  - LOT    : combien d'objets passent a chaque clic
#  - achat  : ce que le JOUEUR PAIE pour un lot (absent = le marchand ne vend pas)
#  - vente  : ce que le JOUEUR GAGNE pour un lot (absent = le marchand n'achete pas)
#
# En jeu : clic gauche acheter un lot (Maj : 8 lots),
#          clic droit vendre un lot (Maj : tout ce qu'on a).
# Le marchand n'achete que des objets normaux : rien de renomme ni d'enchante.
# Presque tout s'achete ET se revend. Exceptions : les livres enchantes (on ne
# les rachete pas, ils sont tous differents).
#
# Regles de coherence suivies :
#  - on revend toujours ~5 fois moins cher qu'on achete (pas de machine a sous) ;
#  - un objet fabrique ne se revend jamais plus cher que ses ingredients
#    (sinon fabriquer puis revendre ferait de l'argent a l'infini) ;
#  - ce qui pousse ou se repand tout seul (pousses, herbe, mousse) se
#    revend presque rien.
#
# Les prix suivent la progression du skyblock : ce qu'on produit tot (pave,
# ble, cannes) rapporte peu mais s'ecoule en masse ; ce qui est rare au
# depart (animaux, minerais, Nether, End) coute cher. On vend toujours a
# environ un cinquieme du prix d'achat, pour que revendre ne soit jamais
# une machine a sous.
#
# version : quand le plugin livre un catalogue plus recent, il remplace
# celui du serveur (l'ancien est garde dans marchands-ancien.yml).
# Si tu modifies ce fichier toi-meme, ne touche pas a ce numero.
#
# Apres une modification : /imt reload
# Pour poser un marchand : se placer, puis  /imt marchand <nom>
# ============================================================

